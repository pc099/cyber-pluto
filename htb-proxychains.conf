# Pluto HTB tunnel: route TCP through the reverse SOCKS proxy that the
# laptop (connected to the HTB VPN) exposes on the VPS via `ssh -R 1080`.
# Use with:  proxychains4 -f htb-proxychains.conf <cmd>
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000
[ProxyList]
socks5 127.0.0.1 1080
